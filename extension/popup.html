<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SyncPress｜跨平台富文本排版与分发器</title>
<style>
  :root { --accent:#4f46e5; --muted:#667085; --line:#e3e6ef; }
  html { width: 380px; max-width: 100%; }
  body {
    box-sizing: border-box; width: 100%; margin: 0; padding: 0 0 14px;
    background: #f4f5f9; color: #20273b;
    font: 13px/1.55 Inter, "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; }
  p, summary, legend { overflow-wrap: anywhere; }

  /* 顶栏：与工作台一致的品牌区 */
  .brand { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: #fff; border-bottom: 1px solid var(--line); }
  .brand-icon { display: grid; place-items: center; width: 30px; height: 30px;
    border-radius: 9px; background: #4f46e5; color: #fff; font: 17px Georgia, serif; }
  .brand-text { flex: 1; min-width: 0; }
  .brand strong { display: block; font-size: 14px; letter-spacing: -.2px; }
  .brand small { display: block; margin-top: 1px; font-size: 10px; color: #667085; }
  .badge { flex: none; padding: 3px 6px; border-radius: 4px; background: #eef1f7;
    color: #667085; font-size: 10px; }

  main { padding: 12px 14px 0; }

  .card { margin-top: 10px; padding: 12px 13px 13px; background: #fff;
    border: 1px solid var(--line); border-radius: 11px; }
  .card:first-of-type { margin-top: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-label { margin: 0 0 9px; font-size: 9px; font-weight: 700;
    letter-spacing: 1.6px; color: #8a8b9b; }
  .card-head .card-label { margin-bottom: 9px; }

  .btn { display: block; width: 100%; margin-top: 9px; padding: 9px 11px;
    border: 1px solid #cdd3e2; border-radius: 7px; background: #fff;
    color: #475467; font-size: 12px; line-height: 1.4; text-align: center; cursor: pointer; }
  .btn:hover { background: #f0f1fa; border-color: #b7bee0; }
  .btn:focus-visible, .pick:focus-within, select:focus-visible, input:focus-visible {
    outline: 2px solid #6d6bf1; outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: default; background: #fff; border-color: #cdd3e2; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: #4338ca; }
  .btn.primary:disabled { background: #ededf1; border-color: #e3e6ef; color: #a3a4b0; opacity: 1; }
  .btn.secondary { background: #eeedff; border-color: #d3d1f8; color: var(--accent); font-weight: 600; }
  .btn.secondary:hover { background: #e5e3ff; border-color: #c7c5f7; }
  .btn.ghost { padding: 7px 10px; font-size: 11px; color: #475467; }
  .text-button { width: auto; margin: 0; padding: 2px 0; border: 0; background: transparent;
    color: var(--muted); font-size: 11px; cursor: pointer; }
  .text-button:hover { color: #b55142; }
  .text-button[hidden] { display: none; }

  #open-studio { margin-top: 0; }

  .state { margin: 0 0 2px; font-size: 12px; line-height: 1.6; color: #475467; white-space: pre-wrap; }
  .state::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 6px;
    border-radius: 50%; background: #3f459d; vertical-align: 1px; }
  .state[data-state="muted"] { color: #8a8b97; }
  .state[data-state="muted"]::before { background: #bfc0cb; }

  .pick { display: flex; flex-direction: column; align-items: center; gap: 3px;
    margin: 0; padding: 14px 10px; border: 1px dashed #c4c5d6; border-radius: 9px;
    background: #f8f9fc; text-align: center; cursor: pointer; }
  .pick:hover { background: #eeeff6; border-color: #a6a8c3; }
  .pick-mark { font-size: 18px; line-height: 1; color: #66688b; }
  .pick strong { font-size: 12px; font-weight: 600; color: #2e304a; }
  .pick span { font-size: 10px; color: #8b8c9e; }

  .hint { margin: 8px 0 0; font-size: 11px; line-height: 1.7; color: var(--muted); white-space: pre-wrap; }
  #manual-status { color: #525470; white-space: pre-wrap; }
  #manual-status[data-state="error"] { color: #a8583f; }
  #manual-status[data-state="warn"] { color: #9a712f; }
  #status { margin: 8px 0 0; padding: 8px 9px; border-radius: 6px; background: #edeef6;
    color: #4e5179; font-size: 11px; line-height: 1.8; white-space: pre-wrap; }
  #status:empty { display: none; }

  details.mini { margin-top: 9px; }
  details.mini > summary { font-size: 11px; color: #5d5e70; cursor: pointer; list-style: none; }
  details.mini > summary::-webkit-details-marker { display: none; }
  details.mini > summary::before { content: '▸ '; }
  details.mini[open] > summary::before { content: '▾ '; }
  details.mini .hint { margin-top: 6px; }
  details.mini label { display: block; margin: 8px 0 3px; font-size: 11px; color: #656679; }
  details.mini input[type=file] { display: block; width: 100%; font-size: 11px; }

  details.advanced { margin-top: 12px; }
  details.advanced > summary { padding: 8px 0; font-size: 10px; font-weight: 700;
    letter-spacing: 1.4px; color: #8a8b9b; list-style: none; cursor: pointer; }
  details.advanced > summary::-webkit-details-marker { display: none; }
  details.advanced > summary::before { content: '▸ '; }
  details.advanced[open] > summary::before { content: '▾ '; }
  details.advanced[open] { padding-bottom: 6px; }
  .adv-body { padding: 10px 12px 12px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; }
  .adv-body > label { display: block; margin: 0 0 4px; font-size: 11px; color: #656679; }
  .adv-body select, .adv-body input[type=date] { display: block; width: 100%; padding: 7px 8px;
    border: 1px solid #dedfe6; border-radius: 6px; background: #fbfbfd; color: #2a2b40; font-size: 12px; }
  .adv-body .hint { margin-top: 6px; }
  .adv-body .btn { margin-top: 8px; }
  .check { display: flex; gap: 7px; align-items: flex-start; margin: 10px 0 0;
    font-size: 11px; line-height: 1.6; color: #667085; }
  .check input { margin: 2px 0 0; }

  /* 0.7.26：与工作台统一的字体、对比度与折叠箭头 */
  :root { --accent:#4f46e5; --muted:#667085; --line:#e3e6ef; }
  body { color:#20273b; background:#f4f5f9;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .brand { padding: 12px 14px; }
  .brand-icon { background: linear-gradient(145deg,#6366f1,#4338ca); font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 6px rgba(20,24,86,.25); }
  .brand small { color: var(--muted); }
  .badge { border-radius: 999px; padding: 2px 8px; color: var(--muted); }
  .card { box-shadow: 0 1px 2px rgba(29,30,45,.05); }
  .card-label { font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .btn { border-color: #cdd3e2; box-shadow: 0 1px 2px rgba(29,30,45,.06); transition: background .15s, border-color .15s; }
  .btn:hover { background: #f8f9fc; border-color: #b3b4c2; }
  .btn.primary { box-shadow: 0 1px 2px rgba(18,23,86,.25); }
  .btn.primary:hover:not(:disabled) { background: #4338ca; }
  .btn.primary:disabled { box-shadow: none; }
  #open-studio { padding: 10px 11px; font-size: 13px; }
  .hint, .state[data-state="muted"], .check { color: var(--muted); }
  .pick { transition: background .15s, border-color .15s; }
  .pick-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    background: #eeedff; color: var(--accent); font-size: 15px; margin-bottom: 3px; }
  details.mini > summary::-webkit-details-marker, details.advanced > summary::-webkit-details-marker { display: none; }
  details.mini > summary::before, details.advanced > summary::before,
  details.mini[open] > summary::before, details.advanced[open] > summary::before {
    content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 7px 2px 1px;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); transition: transform .15s; }
  details.mini[open] > summary::before, details.advanced[open] > summary::before { transform: rotate(45deg); }
  details.advanced > summary { color: var(--muted); letter-spacing: .06em; font-size: 11px; }
  #status { border-left: 3px solid #c7c5f7; }
  #open-studio + .card { margin-top: 10px; }
</style>

<header class="brand">
  <span class="brand-icon">S</span>
  <div class="brand-text">
    <strong>SyncPress</strong>
    <span id="build" hidden></span>
  </div>
  <span class="badge" id="version-badge">v0</span>
</header>

<main>
  <button id="open-studio" class="btn secondary" type="button">打开排版工作台 →</button>

  <section class="card">
    <div class="card-label">当前页面</div>
    <p id="page-status" class="state" data-state="muted">正在识别当前标签页…</p>
    <button id="inspect" class="btn ghost" type="button">检查此编辑页</button>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="card-label">准备包</span>
      <button id="clear-manual" class="text-button" type="button" hidden>清除选择</button>
    </div>
    <label class="pick" for="bundle">
      <span class="pick-mark">↥</span>
      <strong>手动选择准备包</strong>
      <span>选中含 manifest.json 的文件夹</span>
    </label>
    <input id="bundle" type="file" webkitdirectory directory multiple hidden>
    <p id="manual-status" role="status">尚未选择准备包。</p>

    <button id="run" class="btn primary" type="button" disabled>填入准备包</button>
    <p id="status" role="status"></p>

    <details class="mini">
      <summary>文件夹选不了？逐个选择文件</summary>
      <label for="bundle-meta">① 准备包根目录：选中全部 JSON / TXT 文件</label>
      <input id="bundle-meta" type="file" multiple accept=".json,.txt,.html,application/json,text/plain,text/html">
      <label for="bundle-assets">② assets 文件夹：选中全部图片</label>
      <input id="bundle-assets" type="file" multiple accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.bmp">
      <p class="hint">不请求文件夹权限；正文含图片时两项都需选择，图片仍逐个校验 SHA-256。</p>
    </details>
  </section>

  <details class="advanced">
    <summary>高级 / 旧版</summary>
    <div class="adv-body">
      <label for="issue-date">稿件日期（自动选包用）</label>
      <input id="issue-date" type="date">
      <p id="auto-status" class="hint" role="status">正在连接本机助手…</p>
      <select id="auto-version" hidden aria-label="请选择当日采用的修订版本"></select>
      <button id="refresh-auto" class="btn ghost" type="button">刷新准备包</button>

      <details class="mini">
        <summary>连接本机助手（首次连接或更换配置）</summary>
        <p class="hint">connection.json 由本机服务首次配置时自动生成，无需自己编写。连接成功后会记住；无需授权 workspace 目录。</p>
        <input id="bridge-connection" type="file" accept=".json,application/json" aria-label="选择本机连接文件">
        <p class="hint">本机服务需要运行；未安装时请按桥接说明完成首次配置。</p>
      </details>

      <button id="cover-only" class="btn ghost" type="button">只重试封面（微信 / 矩阵）</button>
      <label class="check"><input id="skip-images" type="checkbox"> 测试：跳过正文图片（只填文字和试封面，企鹅号 / 搜狐号）</label>
    </div>
  </details>
</main>

<script src="studio-core.js"></script>
<script src="yidian-contract.js"></script>
<script src="matrix-cover-contract.js"></script>
<script src="image-shrink.js"></script>
<script src="upload-cache.js"></script>
<script src="yidian-format.js"></script><script src="yidian.js"></script>
<script src="toutiao-format.js"></script>
<script src="toutiao.js"></script>
<script src="sohu-format.js"></script>
<script src="other-platforms.js"></script><script src="weibo.js"></script>
<script src="matrix-cover.js"></script>
<script src="wechat-metadata-contract.js"></script>
<script src="bridge-client.js"></script>
<script src="bundle-locator.js"></script>
<script src="distribution-core.js"></script>
<script src="layout-core.js"></script>
<script src="distribution-zip.js"></script><script src="matrix-format.js"></script><script src="popup.js"></script>
</html>
