<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>图文排版与多平台迁移示例</title></head>
<body>
<section style="max-width:677px;font-size:16px;line-height:1.8;color:#333">
  <p>这是一篇由项目自行编写的合成稿件，用于体验导入、编辑与分发，不包含真实客户文章或业务数据。</p>
  <p><img src="assets/cover.png" alt="项目自制的几何示例配图" style="display:block;width:100%;height:auto"></p>
  <h2 style="color:#087fb5;font-size:22px">01 · 原样导入与自由调整</h2>
  <p>保留原稿后，可以调整段落、章节、<strong style="color:#087fb5">重点文字</strong>和图注。需要强调的内容仍保持原意，转换前后可以双侧对照。</p>
  <blockquote style="padding:12px 16px;background-color:#eef7fb;border-left:3px solid #087fb5">准备包保留来源，格式变化有据可查。</blockquote>
  <h2 style="color:#087fb5;font-size:22px">02 · 兼容差异与日志</h2>
  <p>不同平台支持的字号、颜色和图片位置可能不同。图片整合或样式替换应在转换记录中逐项说明，之后由用户检查并手动保存。</p>
  <p>更多内容可使用自己的稿件替换。这里的<a href="https://example.org/">示例链接</a>仅用于检查链接保留。</p>
</section>
</body>
</html>
